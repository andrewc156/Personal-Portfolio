# Site copy written only from spec §3, Andrew's CV and DECISIONS #85–86, in Andrew's first
# person (F19a). Draft copy stays `confirmed: false` until Andrew approves it (see
# docs/QUESTIONS.md).

mission:
  text: >-
    I study mathematics (statistics concentration) and data science and analytics at
    Kennesaw State University. My main research is on RiverNets, a
    project in the KSU TDA Lab, where I use graph-Laplacian regression to predict
    water quality at river stations that have no data. I also work in analytic number
    theory; as a First-Year Scholar, I studied eigenvalues of the fractal Laplacian.
  confirmed: false

about_bio:
  text: >-
    I'm an undergraduate at Kennesaw State University, working toward a B.S. in
    Mathematics (Statistics concentration) and a B.S. in Data Science and Analytics.
    I work in analytic number theory and on predicting water quality on river networks.
    As a First-Year Scholar, I studied spectral analysis on fractals. I'm interested
    in PhD programs and in mathematics and data science REUs.
  confirmed: false

open_science:
  text: >-
    The code for my site is public, including the data pipeline and the
    persistence engine behind the Rising water explorer.
  confirmed: false


# Site copy written only from spec §3 and Andrew's CV. Draft copy stays `confirmed: false`
# until Andrew approves it (see docs/QUESTIONS.md).

mission:
  text: >-
    Andrew Chincea studies mathematics (statistics concentration) and data science and
    analytics at Kennesaw State University. His primary research, on the RiverNets project
    in the KSU TDA Lab, uses graph-Laplacian regression to predict water quality at river
    stations with no data. He also works in analytic number theory and has studied
    eigenvalues of the fractal Laplacian.
  confirmed: false

about_bio:
  text: >-
    Andrew Chincea is an undergraduate at Kennesaw State University studying mathematics
    (statistics concentration) and data science and analytics. His research spans
    water-quality modeling on river networks, analytic number theory, and spectral analysis
    on fractals.
  confirmed: false

open_science:
  text: >-
    The source code for this site is public, including the data pipeline and the
    persistence engine behind the Rising water explorer.
  confirmed: false

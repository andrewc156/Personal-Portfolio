# Test deployment to GitHub Pages (Andrew's explicit OK, DECISIONS #57).
# Cloudflare Pages remains the intended host (docs/deploy.md); that build uses base '/'.
# This workflow builds the static site under the project sub-path and publishes dist/.
# It does not run the data pipeline: public/data/colorado/ is committed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://andrewc156.github.io
          BASE_PATH: /Personal-Portfolio/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
